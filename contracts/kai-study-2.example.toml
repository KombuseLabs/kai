# An invented study (contracts/kai-study-2.md). Every key is written out,
# defaults included, as `kai study new` writes them.
format = "kai-study/2"
name = "fixture-study"
image = "rust"
seed = 7
repetitions = 2

[model]
id = "fixture-model"
tools = ["Read", "Edit", "Write", "Bash", "Glob", "Grep"]
context_tokens = 200000
max_output_tokens = 32000

[limits]
cpus = 2
memory_mib = 4096
timeout_s = 600
max_turns = 40
max_attempts = 2

[question]
metric = "total_tokens"
quality_gate = "pass_rate"
min_saving = 0.20
margin = 0.15
alpha = 0.05

[assumed]
within_task_sd = 0.35
task_by_arm_sd = 0.15

[[arms]]
name = "shadow"
role = "shadow"
addons = []

[[arms]]
name = "ghost"
role = "ghost"
addons = ["ponytail"]
activation = "/ponytail full"

[[tasks]]
id = "fixture-add"
dir = "../fixture-tasks/fixture-add"

[[tasks]]
id = "fixture-parse"
dir = "../fixture-tasks/fixture-parse"
