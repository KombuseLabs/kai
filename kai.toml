# kai's settings for this directory and every directory below it. kai reads
# the first kai.toml it finds from the current directory upward, or the
# file `--config` (or KAI_CONFIG) names. An option, or the environment
# variable beside it, wins over this file, and this file over kai's
# default. A key kai does not know is an error. `kai --help` lists the
# options.

[log]
# Lowest level of the log lines on standard error: off, error, warn, info,
# debug or trace. As --log-level; kai's default is warn.
level = "warn"

# Also write every log line from debug up to this file, one JSON object per
# line. As --log-file; a relative path is taken from this file's directory.
# Unset by default.
# file = "target/kai.jsonl"

[github]
# The repository whose issues are kai's tickets, as owner/name. As --board
# (or KAI_GITHUB_BOARD); `kai github sync` needs one of them. Unset by
# default.
# board = "owner/name"

[store]
# Hatch base URL for the external ticketz mirror. As --store or KAI_STORE.
# The service owns its database, upstream API and GitHub credentials.
# HTTPS is required except on loopback. Default:
# url = "http://127.0.0.1:4287"

[vm]
# Where `kai vm` keeps what it runs microVMs with: Firecracker and the
# guest kernel, which `kai vm fetch` downloads, the initramfs, and the run
# directories of `kai vm run` under runs/. As --cache (or KAI_VM_CACHE); a
# relative path is taken from this file's directory.
# Default: $XDG_CACHE_HOME/kai/vm, else ~/.cache/kai/vm.
# cache = ".kai/vm"

[runs]
# Task directories holding <name>/task.json, relative to this config file.
directory = ".runs"

[proxy]
# Private handoff written by tools/start-proxy; contains no provider key.
connection_file = ".kai/proxy.json"
