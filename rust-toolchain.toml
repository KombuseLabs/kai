# The Rust that builds and tests kai, here and in CI. rustup installs what
# is missing on the first cargo call in this directory. To change the
# version, change it here and in `rust-version` (Cargo.toml) together.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
# kai's init, PID 1 of every microVM, is built for this target, statically
# linked, by crates/vm's build script.
targets = ["x86_64-unknown-linux-musl"]
