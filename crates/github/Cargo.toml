[package]
name = "github"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reads a board's issues from GitHub into kai's tickets, one way"

[dependencies]
# The HTTP client's TLS setup and the rule for plain HTTP (helpers::http).
helpers = { path = "../helpers" }
# HTTP to GitHub's API. Async, on tokio, which kai takes anyway for
# managing VMs (D2). Without default features: HTTP/1 only, no system
# proxy lookup, and TLS through rustls with the system's certificates but
# without a crypto provider of its own (helpers::http installs ring).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# The token, so that it never shows in Debug output or a log line.
secrecy = "0.10.3"
# The shape of GitHub's answers, as kai's own structs rather than a client
# library's models.
serde.workspace = true
# Reads GitHub's answers; an error's body is read before deciding how.
serde_json = "1.0.154"
# The module's error type, as in helpers.
thiserror = "2.0.21"
tracing.workspace = true
types = { path = "../types" }

[dev-dependencies]
# Runs the async tests.
tokio = { version = "1.54.1", features = ["macros", "rt"] }
# A local HTTP server that stands in for GitHub: no network in tests.
wiremock = "0.6.5"

[lints]
workspace = true
