[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "kai's command line"

# The crate is `cli`; the program it builds is `kai`.
[[bin]]
name = "kai"
path = "src/main.rs"

[dependencies]
# One error type for main, with the context of what kai was doing (the
# owner's choice for `cli`, taken at its first use).
anyhow = "1.0.104"
# The command line: options, --help, and options from environment variables.
clap = { version = "4.6.7", features = ["derive", "env"] }
# Reads a `.env` file from the current directory upward into the process
# environment, so that KAI_* variables and the GitHub token need not be
# exported by hand; a variable already set wins over the file. Saves the
# search and the quoting rules of a `.env`, about 100 lines. Maintained
# fork of the abandoned `dotenv`.
dotenvy = "0.15.7"
engine = { path = "../engine" }
helpers = { path = "../helpers" }
# The shape of kai.toml, read through helpers::config.
serde.workspace = true
tracing.workspace = true

[lints]
workspace = true
