[package]
name = "helpers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Infrastructure the other crates share: logging, settings files, HTTP clients, child processes, files put in place whole, SHA-256"

[dependencies]
tracing.workspace = true
# The sinks: formatting for people and as JSON lines, a level per sink.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std", "fmt", "ansi", "json"] }
# A queue and a writer thread per sink, so that logging never waits for a
# disk or a network.
tracing-appender = "0.2.5"
serde.workspace = true
# Settings files are TOML. Reading only: no writing, no editing in place.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
# The error types of the modules. Already in the tree through
# tracing-appender, so it adds no crate.
thiserror = "2.0.21"
# helpers::http: the client every crate that talks HTTP starts from (github,
# vm). Without default features: HTTP/1 only, no system proxy lookup, and
# TLS through rustls with the system's certificates but without a crypto
# provider of its own (see rustls below).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# rustls' crypto provider for reqwest: ring, rather than reqwest's default
# aws-lc, which is a C build and brings more licences.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# helpers::process: child processes, their output and their end. A program
# starts the runtime; this crate never does. `process` brings
# signal-hook-registry and its errno, the two crates this adds to the tree
# (MIT or Apache-2.0).
tokio = { version = "1.54.1", features = ["io-util", "process", "rt", "time"] }
# helpers::hash: SHA-256. Already in the tree as rustls' crypto provider, so
# it adds no crate.
ring = "0.17.14"

[features]
# `helpers::testing`, what the tests of every crate share. Only the other
# crates' `[dev-dependencies]` turn it on, so no program is built with it.
test-support = []

[dev-dependencies]
# The tests read the JSON lines a sink wrote.
serde_json = "1.0.154"
# Runs the async tests and the examples.
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
