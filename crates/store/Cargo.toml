[package]
name = "store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Client of the ticketz mirror exposed through hatch"

[dependencies]
# Common TLS configuration; the client never carries GitHub credentials.
helpers = { path = "../helpers" }
# Async HTTP to the configured mirror service, without redirects or environment proxy lookup.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Decode hatch's process envelope and ticketz's versioned records.
serde.workspace = true
serde_json = "1.0.154"
# Typed transport and protocol failures.
thiserror = "2.0.21"
types = { path = "../types" }

[dev-dependencies]
# An invented HTTP service; tests never require installed tools or GitHub.
wiremock = "0.6.5"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
