[package]
name = "store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A throwaway SQLite cache of the tickets kai fetched"

[dependencies]
# SQLite, synchronous. `bundled` compiles SQLite into kai, so that no
# system library is needed and the version is the one tested.
rusqlite = { version = "0.42.0", features = ["bundled"] }
# The module's error type, as in helpers.
thiserror = "2.0.21"
tracing.workspace = true
types = { path = "../types" }

[lints]
workspace = true
