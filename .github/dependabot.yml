# Dependabot: one pull request a week per ecosystem, with every update of
# that week in it.
#   cargo           the crates of Cargo.lock
#   github-actions  the actions of .github/workflows, which are pinned to
#                   commits; Dependabot moves the commit and the release
#                   named in the comment behind it together
# Not covered: the tool versions in the `env` of .github/workflows/ci.yml
# (cargo-nextest, cargo-deny, typos, lychee) and rust-toolchain.toml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
