# One crate per directory under crates/. A new crate joins by being added
# there.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# The compiler rust-toolchain.toml names; nothing older is built or tested.
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/KombuseLabs/kai"

# Every crate takes these with `[lints] workspace = true`.
[workspace.lints.rust]
# Whatever a crate makes public says what it is: a missing doc comment is a
# warning, and CI treats warnings as errors.
missing_docs = "warn"

[workspace.lints.clippy]
# Only the command line prints. Every other crate says what it has to say
# through tracing, so that the program decides where it goes; `cli` allows
# these two for itself.
print_stdout = "warn"
print_stderr = "warn"
# A dbg! is a leftover.
dbg_macro = "warn"

# Dependencies more than one crate uses, so that they agree on the version.
[workspace.dependencies]
# Logging: every crate logs through tracing's macros; helpers::logging
# decides where the lines go.
tracing = "0.1.44"
# Settings files: helpers::config reads into any type that derives
# `Deserialize`; the program's own crate declares that type.
serde = { version = "1.0.229", features = ["derive"] }
